<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>备忘录</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. 笔记主页 TAB -->
    <div id="tab-notes" class="tab-view active">
        <header>
            <div class="header-left">
                <button class="menu-btn" onclick="toggleSidebar(true)">☰</button>
                <div id="page-title">所有笔记</div>
            </div>
            <button class="btn" onclick="openEditor()">&#10133;</button>
        </header>
        <div id="notes-list"></div>
    </div>

    <!-- 2. “我的” 页面 TAB -->
    <div id="tab-mine" class="tab-view">
        <div class="profile-header">
            <div class="avatar-wrapper" onclick="triggerAvatarUpload()">
                <img id="my-avatar-img" class="avatar-img" src="https://via.placeholder.com/100" alt="头像">
                <div class="avatar-edit-icon">📷</div>
            </div>
            <input type="file" id="avatar-file-input" accept="image/*" style="display:none;" onchange="handleAvatarSelected(this)">
            <div class="user-info">
                <div class="user-nickname" onclick="editNickname()">
                    <span id="my-nickname">点击设置昵称</span> ✏️
                </div>
                <div class="user-account" id="my-username-display">账号: 游客模式</div>
            </div>
        </div>

        <!-- 我的创作 卡片 -->
        <div class="mine-card">
            <div class="card-header-title">我的创作</div>
            <div class="creation-stats">
                <div class="stat-item">
                    <div class="stat-label">笔记</div>
                    <div class="stat-num"><span id="stat-notes-count">0</span><span class="stat-unit">篇</span></div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">累计字数</div>
                    <div class="stat-num"><span id="stat-words-count">0</span><span class="stat-unit">字</span></div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">使用天数</div>
                    <div class="stat-num"><span id="stat-days-count">1</span><span class="stat-unit">天</span></div>
                </div>
            </div>
        </div>

        <!-- 其他设置 卡片列表 -->
        <div class="section-title">其他设置</div>
        <div class="list-card">
            <div class="list-row" onclick="alert('可以直接使用手机/电脑浏览器打开当前网址，登录账号即可跨端协同编辑笔记。')">
                <span>在电脑、iPad 编辑笔记</span>
                <span class="chevron">></span>
            </div>
            <div class="list-row" onclick="openSubView('trash-view')">
                <span>最近删除</span>
                <div class="list-row-right">
                    <span id="trash-count-display">0</span>
                    <span class="chevron">></span>
                </div>
            </div>
            <div class="list-row" onclick="openSubView('settings-view')">
                <span>设置</span>
                <span class="chevron">></span>
            </div>
        </div>

        <!-- 登录 / 退出 按钮列表 -->
        <div class="list-card">
            <div class="list-row" onclick="handleAuthButtonClick()" style="justify-content: center; color: var(--ios-yellow); font-weight: bold;">
                <span id="auth-btn-text">登录账号开启同步</span>
            </div>
        </div>
    </div>

    <!-- 🔻 底部导航栏 -->
    <div class="bottom-nav">
        <div class="nav-item active" id="nav-notes" onclick="switchTab('notes')">
            <div class="nav-icon">📝</div>
            <div>笔记</div>
        </div>
        <div class="nav-item" id="nav-mine" onclick="switchTab('mine')">
            <div class="nav-icon">👤</div>
            <div>我的</div>
        </div>
    </div>

    <!-- 3. 设置 界面 -->
    <div id="settings-view" class="sub-view">
        <div class="sub-header">
            <button class="btn" onclick="closeSubView('settings-view')">&#10094; 设置</button>
            <div></div>
        </div>
        <div class="section-title">笔记</div>
        <div class="list-card">
            <div class="list-row" onclick="openLockModal()">
                <span>加锁笔记显示设置</span>
                <span class="chevron">></span>
            </div>
            <div class="list-row">
                <span>笔记内容页面显示字数</span>
                <input type="checkbox" class="ios-switch" id="setting-word-count" checked onchange="saveSettings()">
            </div>
            <div class="list-row" onclick="changeDefaultFontSize()">
                <span>笔记默认字号</span>
                <div class="list-row-right">
                    <span id="setting-font-size-text">16</span>
                    <span class="chevron">></span>
                </div>
            </div>
        </div>
    </div>

    <!-- 4. 最近删除 界面 -->
    <div id="trash-view" class="sub-view">
        <div class="sub-header">
            <button class="btn" onclick="closeSubView('trash-view')">&#10094; 最近删除</button>
            <button class="btn" onclick="clearAllTrash()" style="color:var(--delete-red);">清空</button>
        </div>
        <div class="section-title">保留天数为 7 天，过期将彻底清除</div>
        <div id="trash-list" style="padding: 0 20px 20px;"></div>
    </div>

    <!-- 5. 加锁笔记显示设置 弹窗 -->
    <div id="lock-modal-overlay" class="modal-overlay" onclick="closeLockModal()"></div>
    <div id="lock-modal-card" class="lock-modal-card">
        <div class="lock-modal-title">加锁笔记显示设置</div>
        <div class="lock-option-row" onclick="setLockDisplayMode('all')">
            <span>在“已加锁”分类和原文件夹中均可显示加锁笔记</span>
            <div class="lock-radio-dot" id="radio-lock-all"></div>
        </div>
        <div class="lock-option-row" onclick="setLockDisplayMode('locked_only')">
            <span>仅在“已加锁”分类中显示加锁笔记</span>
            <div class="lock-radio-dot" id="radio-lock-only"></div>
        </div>
        <div class="lock-cancel-btn" onclick="closeLockModal()">取消</div>
    </div>

    <!-- 侧边栏抽屉 -->
    <div id="sidebar-overlay" onclick="toggleSidebar(false)"></div>
    <div id="sidebar" class="sidebar">
        <div class="sidebar-title">文件夹</div>
        <div class="sidebar-menu" id="sidebar-menu-list"></div>
        <div class="add-folder-btn" onclick="createNewFolder()">+ 新建文件夹</div>
    </div>

    <!-- 长按菜单 -->
    <div id="context-overlay" onclick="closeContextMenu()"></div>
    <div id="context-menu" class="context-menu">
        <div class="menu-item" onclick="handleMenuAction('pin')"><span id="menu-pin-text">置顶</span> 📌</div>
        <div class="menu-item" onclick="handleMenuAction('lock')"><span id="menu-lock-text">加密</span> 🔒</div>
        <div class="menu-item danger" onclick="handleMenuAction('delete')"><span>删除</span> 🗑️</div>
    </div>

    <!-- 账号 Auth 弹窗 -->
    <div id="auth-modal-overlay" class="modal-overlay" onclick="closeAuthModal()"></div>
    <div id="auth-card" class="auth-card">
        <div class="auth-title" id="auth-title">账号登录</div>
        <input type="text" id="auth-username" class="auth-input" placeholder="用户名">
        <input type="password" id="auth-password" class="auth-input" placeholder="密码">
        <button class="auth-btn" id="auth-submit-btn" onclick="submitAuth()">登录</button>
        <div class="auth-switch" id="auth-switch-btn" onclick="toggleAuthMode()">没有账号？立即注册</div>
    </div>

    <!-- 6. 编辑器视图 (图2样式还原) -->
    <div id="editor-view" class="sub-view">
        <div class="sub-header" style="border-bottom: 0.5px solid #e5e5ea;">
            <button class="btn" onclick="saveNote()">&#10094;</button>
            <div style="display:flex; gap:16px; align-items:center;">
                <span class="editor-header-icon" onclick="formatDoc('undo')">↶</span>
                <span class="editor-header-icon" onclick="formatDoc('redo')">↷</span>
                <button class="btn" onclick="saveNote()" style="font-weight: bold; font-size: 18px;">✓</button>
            </div>
        </div>
        
        <input type="text" id="note-title-input" class="title-input" placeholder="标题">
        <div id="note-content-editor" class="editor-content" contenteditable="true" placeholder="开始输入内容..." oninput="onEditorInput()"></div>

        <!-- 图2风格：展开排版面板 -->
        <div id="editor-format-panel" class="format-panel">
            <!-- 基础样式按钮 -->
            <div class="format-row style-btns-row">
                <button class="fmt-btn" onclick="formatDoc('bold')"><b>B</b></button>
                <button class="fmt-btn" onclick="formatDoc('italic')"><i>I</i></button>
                <button class="fmt-btn" onclick="formatDoc('underline')"><u>U</u></button>
                <button class="fmt-btn" onclick="formatDoc('strikeThrough')"><s>S</s></button>
                <button class="fmt-btn" onclick="toggleHighlight()">🖌️</button>
            </div>

            <!-- 字号选择器 -->
            <div class="format-section">
                <div class="format-label">字号</div>
                <div class="size-selector-row">
                    <span class="size-opt" onclick="setEditorFontSize('10', this)">10</span>
                    <span class="size-opt" onclick="setEditorFontSize('12', this)">12</span>
                    <span class="size-opt" onclick="setEditorFontSize('14', this)">14</span>
                    <span class="size-opt active" onclick="setEditorFontSize('16', this)">16</span>
                    <span class="size-opt" onclick="setEditorFontSize('18', this)">18</span>
                    <span class="size-opt" onclick="setEditorFontSize('20', this)">20</span>
                    <span class="size-opt" onclick="setEditorFontSize('24', this)">24</span>
                    <span class="size-opt" onclick="setEditorFontSize('36', this)">36</span>
                </div>
            </div>

            <!-- 颜色选择器 -->
            <div class="format-section">
                <div class="format-label">字体颜色</div>
                <div class="color-palette-row">
                    <div class="color-block" style="background:#000000;" onclick="setEditorColor('#000000', this)"></div>
                    <div class="color-block" style="background:#48484a;" onclick="setEditorColor('#48484a', this)"></div>
                    <div class="color-block" style="background:#8e8e93;" onclick="setEditorColor('#8e8e93', this)"></div>
                    <div class="color-block" style="background:#ff3b30;" onclick="setEditorColor('#ff3b30', this)"></div>
                    <div class="color-block" style="background:#ff9500;" onclick="setEditorColor('#ff9500', this)"></div>
                    <div class="color-block" style="background:#ffcc00;" onclick="setEditorColor('#ffcc00', this)"></div>
                    <div class="color-block active" style="background:#34c759;" onclick="setEditorColor('#34c759', this)">✓</div>
                    <div class="color-block" style="background:#5ac8fa;" onclick="setEditorColor('#5ac8fa', this)"></div>
                    <div class="color-block" style="background:#007aff;" onclick="setEditorColor('#007aff', this)"></div>
                </div>
            </div>
        </div>

        <!-- 底部固定工具栏（图2图标栏） -->
        <div class="editor-bottom-bar">
            <button class="bottom-tool-btn" onclick="alert('AI 辅助已就绪')"><span class="ai-badge">AI</span></button>
            <button class="bottom-tool-btn">🔲</button>
            <button class="bottom-tool-btn active" id="btn-toggle-aa" onclick="toggleAaPanel()">Aa</button>
            <button class="bottom-tool-btn" onclick="formatDoc('insertUnorderedList')">≡</button>
            <button class="bottom-tool-btn" onclick="insertChecklist()">☑</button>
            <button class="bottom-tool-btn" id="img-upload-btn" onclick="triggerNoteImageSelect()">🖼</button>
            <input type="file" id="note-image-file-input" accept="image/*" style="display:none;" onchange="uploadNoteImage(this)">
            <button class="bottom-tool-btn" onclick="toggleFolderSelect()">⊕</button>
            <div class="word-count-badge" id="editor-word-count-tag"></div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
