<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>备忘录</title>
    <style>
        :root { 
            --ios-yellow: #e5a90f; 
            --bg: #f4f4f6; 
            --text: #000; 
            --delete-red: #ff3b30;
            --pin-yellow: #ff9500;
            --lock-purple: #5856d6;
            --card-bg: #ffffff;
        }
        
        * { box-sizing: border-box; }

        body { 
            margin: 0 auto; 
            max-width: 600px; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            -webkit-tap-highlight-color: transparent; 
            overflow-x: hidden;
            min-height: 100vh;
            padding-bottom: 70px;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 顶部 Header */
        header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; font-size: 24px; font-weight: bold; background: var(--bg); }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .menu-btn { font-size: 24px; cursor: pointer; color: var(--ios-yellow); background: none; border: none; padding: 0; }
        .btn { color: var(--ios-yellow); background: none; border: none; font-size: 17px; cursor: pointer; padding: 0; display: flex; align-items: center; gap: 4px; }
        
        /* Tab 容器 */
        .tab-view { display: none; }
        .tab-view.active { display: block; }

        .section-title { padding: 12px 20px 6px; font-size: 13px; color: #8e8e93; font-weight: 600; text-transform: uppercase; }
        #notes-list { padding: 0 20px 20px; }

        /* 侧边栏抽屉 UI */
        #sidebar-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.3); z-index: 300; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        #sidebar-overlay.active { opacity: 1; pointer-events: auto; }

        .sidebar {
            position: fixed; top: 0; bottom: 0; left: 0; width: 280px;
            background: rgba(248, 248, 248, 0.92);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            z-index: 310; transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            padding: 20px; display: flex; flex-direction: column; box-shadow: 5px 0 25px rgba(0,0,0,0.1);
        }
        .sidebar.active { transform: translateX(0); }
        .sidebar-title { font-size: 22px; font-weight: bold; margin-bottom: 20px; }
        .sidebar-menu { list-style: none; padding: 0; margin: 0; flex: 1; overflow-y: auto; }
        .sidebar-item { padding: 12px 14px; border-radius: 10px; margin-bottom: 6px; font-size: 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .sidebar-item.active { background: rgba(229, 169, 15, 0.15); color: var(--ios-yellow); font-weight: 600; }
        .add-folder-btn { margin-top: 10px; padding: 12px; border: 1px dashed var(--ios-yellow); color: var(--ios-yellow); border-radius: 10px; text-align: center; font-weight: 500; cursor: pointer; }

        /* 笔记卡片及滑动选项 */
        .note-container { position: relative; margin-bottom: 10px; border-radius: 12px; overflow: hidden; background: #c7c7cc; }
        .swipe-actions { position: absolute; right: 0; top: 0; bottom: 0; display: flex; width: 210px; z-index: 1; }
        .action-btn { flex: 1; border: none; color: white; font-size: 15px; font-weight: 500; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .action-btn.pin { background: var(--pin-yellow); }
        .action-btn.lock { background: var(--lock-purple); }
        .action-btn.delete { background: var(--delete-red); }

        .note-item { 
            background: white; padding: 14px 16px; position: relative; z-index: 2; 
            transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1); touch-action: pan-y; cursor: pointer; border-radius: 12px;
        }
        .note-item.pressing { transform: scale(0.96) !important; transition: transform 0.15s ease-out !important; }
        .note-item.pop-active { z-index: 50 !important; transform: scale(1.03) !important; box-shadow: 0 15px 35px rgba(0,0,0,0.25); }

        .note-header-line { display: flex; justify-content: space-between; align-items: center; }
        .note-title { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
        .note-badge { font-size: 14px; margin-left: 8px; display: flex; gap: 4px; }
        .note-item-date { font-size: 13px; color: #8e8e93; margin-top: 4px; }

        /* “我的”页面组件样式 */
        .profile-header { padding: 20px 24px; display: flex; align-items: center; gap: 16px; }
        .avatar-wrapper { position: relative; width: 68px; height: 68px; cursor: pointer; }
        .avatar-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #e5e5ea; }
        .avatar-edit-icon { position: absolute; bottom: 0; right: 0; background: rgba(0,0,0,0.5); color: white; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 11px; }
        .user-info { flex: 1; }
        .user-nickname { font-size: 22px; font-weight: 800; color: #000; display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .user-account { font-size: 14px; color: #8e8e93; margin-top: 4px; }

        .mine-card { background: var(--card-bg); border-radius: 20px; padding: 20px; margin: 0 20px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .card-header-title { font-size: 18px; font-weight: bold; margin-bottom: 16px; color: #1c1c1e; }

        .creation-stats { display: flex; justify-content: space-around; align-items: flex-end; text-align: left; padding: 10px 0; }
        .stat-item { flex: 1; text-align: center; }
        .stat-label { font-size: 14px; color: #8e8e93; margin-bottom: 8px; }
        .stat-num { font-size: 28px; font-weight: 800; color: #000; line-height: 1; }
        .stat-unit { font-size: 13px; color: #8e8e93; font-weight: normal; margin-left: 2px; }

        .list-card { background: var(--card-bg); border-radius: 20px; margin: 0 20px 16px; overflow: hidden; }
        .list-row { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; font-size: 16px; color: #1c1c1e; cursor: pointer; border-bottom: 0.5px solid #f2f2f7; }
        .list-row:last-child { border-bottom: none; }
        .list-row-right { display: flex; align-items: center; gap: 8px; color: #8e8e93; font-size: 15px; }
        .chevron { color: #c7c7cc; font-size: 18px; font-family: monospace; }

        /* iOS 开关组件 */
        .ios-switch { position: relative; width: 51px; height: 31px; appearance: none; background: #e9e9ea; border-radius: 31px; outline: none; transition: 0.25s; cursor: pointer; }
        .ios-switch:checked { background: var(--ios-yellow); }
        .ios-switch::after { content: ''; position: absolute; width: 27px; height: 27px; border-radius: 50%; background: white; top: 2px; left: 2px; transition: 0.25s; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .ios-switch:checked::after { transform: translateX(20px); }

        /* 🔻 底部导航栏 */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; max-width: 600px; margin: 0 auto; height: 60px;
            background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-top: 0.5px solid rgba(0,0,0,0.1); display: flex; justify-content: space-around; align-items: center; z-index: 150;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #8e8e93; font-size: 11px; cursor: pointer; flex: 1; height: 100%; }
        .nav-item.active { color: var(--ios-yellow); font-weight: 600; }
        .nav-icon { font-size: 20px; }

        /* 全屏子视图 (设置/编辑器/回收站) -> z-index提升至250，完美挡住底部导航栏 */
        .sub-view { 
            position: fixed; inset: 0; margin: 0 auto; max-width: 600px; background: var(--bg); z-index: 250; display: flex; flex-direction: column; 
            opacity: 0; pointer-events: none; transform: translateX(100%); transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
        }
        .sub-view.active { opacity: 1; pointer-events: auto; transform: translateX(0); }
        .sub-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; background: var(--bg); font-size: 18px; font-weight: bold; }

        /* 通用 Modal 遮罩及卡片 */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(5px); z-index: 400; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        /* 加锁笔记设置模态框 (完美还原图片) */
        .lock-modal-card {
            position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(0.9);
            width: 320px; background: #f9f9f9; border-radius: 18px; padding: 22px 0 0;
            z-index: 410; opacity: 0; pointer-events: none; transition: all 0.25s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); overflow: hidden;
        }
        .lock-modal-card.active { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
        .lock-modal-title { font-size: 18px; font-weight: bold; text-align: center; margin-bottom: 20px; padding: 0 20px; color: #000; }
        .lock-option-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 20px; font-size: 15px; color: #1c1c1e; border-top: 0.5px solid #e5e5ea; cursor: pointer; text-align: left;
        }
        .lock-radio-dot {
            width: 20px; height: 20px; border-radius: 50%; border: 2px solid #c7c7cc;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-left: 12px;
        }
        .lock-radio-dot.checked { border-color: var(--ios-yellow); background: var(--ios-yellow); }
        .lock-radio-dot.checked::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: white; }
        .lock-cancel-btn {
            text-align: center; padding: 14px; font-size: 17px; font-weight: bold;
            color: var(--ios-yellow); border-top: 0.5px solid #e5e5ea; cursor: pointer; background: #f9f9f9; margin-top: 8px;
        }

        /* 长按菜单 & Auth 弹窗 */
        #context-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.35); backdrop-filter: blur(10px); z-index: 300; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
        #context-overlay.active { opacity: 1; pointer-events: auto; }
        .context-menu {
            position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(0.8); width: 250px;
            background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(20px); border-radius: 14px; z-index: 310; opacity: 0; pointer-events: none; box-shadow: 0 20px 40px rgba(0,0,0,0.2); transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275); overflow: hidden;
        }
        .context-menu.active { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
        .menu-item { padding: 14px 18px; font-size: 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 0.5px solid rgba(0,0,0,0.1); cursor: pointer; }
        .menu-item.danger { color: var(--delete-red); }

        .auth-card {
            position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%) scale(0.9); width: 300px;
            background: white; border-radius: 16px; padding: 24px; z-index: 410; opacity: 0; pointer-events: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); transition: all 0.25s ease;
        }
        .auth-card.active { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
        .auth-title { font-size: 20px; font-weight: bold; text-align: center; margin-bottom: 20px; }
        .auth-input { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #e5e5ea; border-radius: 10px; font-size: 15px; outline: none; background: #f9f9f9; }
        .auth-btn { width: 100%; padding: 12px; background: var(--ios-yellow); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 6px; }
        .auth-switch { text-align: center; font-size: 13px; color: #8e8e93; margin-top: 14px; cursor: pointer; }

        /* 编辑器内部结构 */
        #editor-view { background: white; }
        .title-input { border: none; outline: none; font-size: 22px; font-weight: bold; padding: 16px 20px 8px; width: calc(100% - 40px); font-family: inherit; }
        .toolbar { display: flex; align-items: center; gap: 10px; padding: 8px 20px; background: #f8f8f8; border-bottom: 1px solid #e5e5ea; flex-wrap: wrap; }
        .tool-btn { background: white; border: 1px solid #ccc; border-radius: 4px; padding: 4px 8px; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; }
        .color-picker { border: none; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; background: transparent; }
        .editor-content { flex: 1; padding: 12px 20px; font-size: 17px; line-height: 1.5; outline: none; overflow-y: auto; word-break: break-word; user-select: text; -webkit-user-select: text; }
        .editor-content img { max-width: 100%; border-radius: 8px; margin: 8px 0; display: block; }
        .editor-content[placeholder]:empty:before { content: attr(placeholder); color: #a9a9a9; }
        .word-count-badge { font-size: 13px; color: #8e8e93; font-weight: normal; margin-left: auto; }
    </style>
</head>
<body>

    <!-- 1. 笔记主页 TAB -->
    <div id="tab-notes" class="tab-view active">
        <header>
            <div class="header-left">
                <button class="menu-btn" onclick="toggleSidebar(true)">☰</button>
                <div id="page-title">所有笔记</div>
            </div>
            <button class="btn" onclick="openEditor()">&#10133;</button>
        </header>
        <div id="notes-list"></div>
    </div>

    <!-- 2. “我的” 页面 TAB -->
    <div id="tab-mine" class="tab-view">
        <div class="profile-header">
            <div class="avatar-wrapper" onclick="triggerAvatarUpload()">
                <img id="my-avatar-img" class="avatar-img" src="https://via.placeholder.com/100" alt="头像">
                <div class="avatar-edit-icon">📷</div>
            </div>
            <input type="file" id="avatar-file-input" accept="image/*" style="display:none;" onchange="handleAvatarSelected(this)">
            <div class="user-info">
                <div class="user-nickname" onclick="editNickname()">
                    <span id="my-nickname">点击设置昵称</span> ✏️
                </div>
                <div class="user-account" id="my-username-display">账号: 游客模式</div>
            </div>
        </div>

        <!-- 我的创作 卡片 -->
        <div class="mine-card">
            <div class="card-header-title">我的创作</div>
            <div class="creation-stats">
                <div class="stat-item">
                    <div class="stat-label">笔记</div>
                    <div class="stat-num"><span id="stat-notes-count">0</span><span class="stat-unit">篇</span></div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">累计字数</div>
                    <div class="stat-num"><span id="stat-words-count">0</span><span class="stat-unit">字</span></div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">使用天数</div>
                    <div class="stat-num"><span id="stat-days-count">1</span><span class="stat-unit">天</span></div>
                </div>
            </div>
        </div>

        <!-- 其他设置 卡片列表 -->
        <div class="section-title">其他设置</div>
        <div class="list-card">
            <div class="list-row" onclick="alert('可以直接使用手机/电脑浏览器打开当前网址，登录账号即可跨端协同编辑笔记。')">
                <span>在电脑、iPad 编辑笔记</span>
                <span class="chevron">></span>
            </div>
            <div class="list-row" onclick="openSubView('trash-view')">
                <span>最近删除</span>
                <div class="list-row-right">
                    <span id="trash-count-display">0</span>
                    <span class="chevron">></span>
                </div>
            </div>
            <div class="list-row" onclick="openSubView('settings-view')">
                <span>设置</span>
                <span class="chevron">></span>
            </div>
        </div>

        <!-- 登录 / 退出 按钮列表 -->
        <div class="list-card">
            <div class="list-row" onclick="handleAuthButtonClick()" style="justify-content: center; color: var(--ios-yellow); font-weight: bold;">
                <span id="auth-btn-text">登录账号开启同步</span>
            </div>
        </div>
    </div>

    <!-- 🔻 底部导航栏 -->
    <div class="bottom-nav">
        <div class="nav-item active" id="nav-notes" onclick="switchTab('notes')">
            <div class="nav-icon">📝</div>
            <div>笔记</div>
        </div>
        <div class="nav-item" id="nav-mine" onclick="switchTab('mine')">
            <div class="nav-icon">👤</div>
            <div>我的</div>
        </div>
    </div>

    <!-- 3. 设置 界面 -->
    <div id="settings-view" class="sub-view">
        <div class="sub-header">
            <button class="btn" onclick="closeSubView('settings-view')">&#10094; 设置</button>
            <div></div>
        </div>
        <div class="section-title">笔记</div>
        <div class="list-card">
            <div class="list-row" onclick="openLockModal()">
                <span>加锁笔记显示设置</span>
                <span class="chevron">></span>
            </div>
            <div class="list-row">
                <span>笔记列表显示皮肤</span>
                <input type="checkbox" class="ios-switch" id="setting-skin" onchange="saveSettings()">
            </div>
            <div class="list-row">
                <span>笔记内容页面显示字数</span>
                <input type="checkbox" class="ios-switch" id="setting-word-count" checked onchange="saveSettings()">
            </div>
            <div class="list-row" onclick="changeDefaultFontSize()">
                <span>笔记默认字号</span>
                <div class="list-row-right">
                    <span id="setting-font-size-text">16</span>
                    <span class="chevron">></span>
                </div>
            </div>
        </div>
    </div>

    <!-- 4. 最近删除 界面 -->
    <div id="trash-view" class="sub-view">
        <div class="sub-header">
            <button class="btn" onclick="closeSubView('trash-view')">&#10094; 最近删除</button>
            <button class="btn" onclick="clearAllTrash()" style="color:var(--delete-red);">清空</button>
        </div>
        <div class="section-title">保留天数为 7 天，过期将彻底清除</div>
        <div id="trash-list" style="padding: 0 20px 20px;"></div>
    </div>

    <!-- 5. 加锁笔记显示设置 弹窗 -->
    <div id="lock-modal-overlay" class="modal-overlay" onclick="closeLockModal()"></div>
    <div id="lock-modal-card" class="lock-modal-card">
        <div class="lock-modal-title">加锁笔记显示设置</div>
        <div class="lock-option-row" onclick="setLockDisplayMode('all')">
            <span>在“已加锁”分类和原文件夹中均可显示加锁笔记</span>
            <div class="lock-radio-dot" id="radio-lock-all"></div>
        </div>
        <div class="lock-option-row" onclick="setLockDisplayMode('locked_only')">
            <span>仅在“已加锁”分类中显示加锁笔记</span>
            <div class="lock-radio-dot" id="radio-lock-only"></div>
        </div>
        <div class="lock-cancel-btn" onclick="closeLockModal()">取消</div>
    </div>

    <!-- 侧边栏抽屉 -->
    <div id="sidebar-overlay" onclick="toggleSidebar(false)"></div>
    <div id="sidebar" class="sidebar">
        <div class="sidebar-title">文件夹</div>
        <div class="sidebar-menu" id="sidebar-menu-list"></div>
        <div class="add-folder-btn" onclick="createNewFolder()">+ 新建文件夹</div>
    </div>

    <!-- 长按菜单 -->
    <div id="context-overlay" onclick="closeContextMenu()"></div>
    <div id="context-menu" class="context-menu">
        <div class="menu-item" onclick="handleMenuAction('pin')"><span id="menu-pin-text">置顶</span> 📌</div>
        <div class="menu-item" onclick="handleMenuAction('lock')"><span id="menu-lock-text">加密</span> 🔒</div>
        <div class="menu-item danger" onclick="handleMenuAction('delete')"><span>删除</span> 🗑️</div>
    </div>

    <!-- 账号 Auth 弹窗 -->
    <div id="auth-modal-overlay" class="modal-overlay" onclick="closeAuthModal()"></div>
    <div id="auth-card" class="auth-card">
        <div class="auth-title" id="auth-title">账号登录</div>
        <input type="text" id="auth-username" class="auth-input" placeholder="用户名">
        <input type="password" id="auth-password" class="auth-input" placeholder="密码">
        <button class="auth-btn" id="auth-submit-btn" onclick="submitAuth()">登录</button>
        <div class="auth-switch" id="auth-switch-btn" onclick="toggleAuthMode()">没有账号？立即注册</div>
    </div>

    <!-- 编辑器视图 -->
    <div id="editor-view" class="sub-view">
        <div class="sub-header" style="border-bottom: 1px solid #e5e5ea;">
            <button class="btn" onclick="saveNote()">&#10094; 备忘录</button>
            <div class="word-count-badge" id="editor-word-count-tag"></div>
            <button class="btn" onclick="saveNote()" style="font-weight: bold; margin-left:12px;">完成</button>
        </div>
        <input type="text" id="note-title-input" class="title-input" placeholder="标题">
        <div class="toolbar">
            <button class="tool-btn" onclick="formatDoc('bold')"><b>B</b></button>
            <button class="tool-btn" onclick="formatDoc('italic')"><i>I</i></button>
            <button class="tool-btn" onclick="formatDoc('underline')"><u>U</u></button>
            <select class="tool-btn" onchange="formatDoc('fontSize', this.value)">
                <option value="3">标准字号</option>
                <option value="1">小字号</option>
                <option value="5">大字号</option>
                <option value="7">超大字号</option>
            </select>
            <input type="color" class="color-picker" onchange="formatDoc('foreColor', this.value)">
            <button class="tool-btn" id="img-upload-btn" onclick="triggerNoteImageSelect()">📷 图片</button>
            <input type="file" id="note-image-file-input" accept="image/*" style="display:none;" onchange="uploadNoteImage(this)">
            <select id="editor-folder-select" class="tool-btn"></select>
        </div>
        <div id="note-content-editor" class="editor-content" contenteditable="true" placeholder="开始输入内容..." oninput="onEditorInput()"></div>
    </div>
    <script>
        const IMG_BED_DOMAIN = "https://wp.fuchen.indevs.in";

        let currentNoteId = null;
        let notesData = [];
        let trashNotesData = [];
        let foldersData = [];
        let currentFilter = 'all';
        let activeMenuNoteId = null;
        let isAuthRegisterMode = false;
        let userProfile = { nickname: '', avatar_url: '', username: '' };
        let lockDisplayMode = 'all'; // 'all' 或 'locked_only'

        function getToken() { return localStorage.getItem('auth_token'); }
        function isLoggedIn() { return !!getToken(); }
        function formatDoc(cmd, value = null) { document.execCommand(cmd, false, value); }

        async function initData() {
            initAppFirstRun();
            loadSavedSettings();
            await fetchUserProfile();
            await fetchFolders();
            await fetchTrashNotes();
            await fetchNotes();
        }

        /* 首次使用天数统计 */
        function initAppFirstRun() {
            if (!localStorage.getItem('app_first_run_time')) {
                localStorage.setItem('app_first_run_time', Date.now().toString());
            }
        }

        function calculateDaysInUse() {
            const firstTime = parseInt(localStorage.getItem('app_first_run_time') || Date.now());
            const diffMs = Date.now() - firstTime;
            const days = Math.floor(diffMs / (1000 * 60 * 60 * 24)) + 1;
            return Math.max(1, days);
        }

        /* 计算文字数量 helper */
        function getPlainTextLength(htmlContent) {
            if (!htmlContent) return 0;
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = htmlContent;
            const text = tempDiv.textContent || tempDiv.innerText || '';
            return text.replace(/\s+/g, '').length;
        }

        /* 切换 Tab 页面 */
        function switchTab(tab) {
            document.querySelectorAll('.tab-view').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            if (tab === 'notes') {
                document.getElementById('tab-notes').classList.add('active');
                document.getElementById('nav-notes').classList.add('active');
            } else if (tab === 'mine') {
                document.getElementById('tab-mine').classList.add('active');
                document.getElementById('nav-mine').classList.add('active');
                fetchUserProfile();
            }
        }

        /* 网络 API 助手 */
        async function apiFetch(url, options = {}) {
            if (!isLoggedIn()) return null;
            const token = getToken();
            options.headers = {
                ...options.headers,
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            };
            const res = await fetch(url, options);
            if (res.status === 401) {
                alert("登录凭证已过期，请重新登录");
                localStorage.removeItem('auth_token');
                localStorage.removeItem('auth_username');
                initData();
                return null;
            }
            return res;
        }

        /* 用户资料读取与保存（修正恢复默认的Bug） */
        async function fetchUserProfile() {
            if (isLoggedIn()) {
                const res = await apiFetch('/api/user/profile');
                if (res && res.ok) {
                    userProfile = await res.json();
                }
            } else {
                const savedProfile = JSON.parse(localStorage.getItem('guest_profile') || '{}');
                userProfile = {
                    username: '游客模式',
                    nickname: savedProfile.nickname || '点击设置昵称',
                    avatar_url: savedProfile.avatar_url || 'https://via.placeholder.com/100'
                };
            }
            renderProfileUI();
        }

        function renderProfileUI() {
            document.getElementById('my-nickname').innerText = userProfile.nickname || '点击设置昵称';
            document.getElementById('my-username-display').innerText = isLoggedIn() ? `账号: ${userProfile.username}` : '账号: 游客模式';
            document.getElementById('my-avatar-img').src = userProfile.avatar_url || 'https://via.placeholder.com/100';
            document.getElementById('auth-btn-text').innerText = isLoggedIn() ? '退出当前账号' : '登录账号开启同步';
            updateCreationStats();
        }

        function updateCreationStats() {
            document.getElementById('stat-notes-count').innerText = notesData.length;
            let totalWords = 0;
            notesData.forEach(n => {
                totalWords += (n.title ? n.title.length : 0) + getPlainTextLength(n.content);
            });
            document.getElementById('stat-words-count').innerText = totalWords;
            document.getElementById('stat-days-count').innerText = calculateDaysInUse();
            document.getElementById('trash-count-display').innerText = trashNotesData.length;
        }

        async function editNickname() {
            const current = (userProfile.nickname === '点击设置昵称') ? '' : userProfile.nickname;
            const newName = prompt("请输入新昵称：", current);
            if (newName !== null && newName.trim()) {
                const trimmed = newName.trim();
                userProfile.nickname = trimmed;
                if (isLoggedIn()) {
                    await apiFetch('/api/user/profile', { method: 'PUT', body: JSON.stringify({ nickname: trimmed }) });
                } else {
                    const savedProfile = JSON.parse(localStorage.getItem('guest_profile') || '{}');
                    savedProfile.nickname = trimmed;
                    localStorage.setItem('guest_profile', JSON.stringify(savedProfile));
                }
                renderProfileUI();
            }
        }

        function triggerAvatarUpload() { document.getElementById('avatar-file-input').click(); }

        async function handleAvatarSelected(input) {
            const file = input.files[0];
            if (!file) return;

            const uploadedUrl = await uploadFileToBed(file, '/备忘录/用户头像');
            if (uploadedUrl) {
                userProfile.avatar_url = uploadedUrl;
                if (isLoggedIn()) {
                    await apiFetch('/api/user/profile', { method: 'PUT', body: JSON.stringify({ avatar_url: uploadedUrl }) });
                } else {
                    const savedProfile = JSON.parse(localStorage.getItem('guest_profile') || '{}');
                    savedProfile.avatar_url = uploadedUrl;
                    localStorage.setItem('guest_profile', JSON.stringify(savedProfile));
                }
                renderProfileUI();
            }
            input.value = '';
        }

        /* 图床上传 */
        async function uploadFileToBed(file, uploadFolder) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('uploadFolder', uploadFolder);
            formData.append('uploadChannel', 'huggingface');
            formData.append('channelName', '浮尘');
            formData.append('uploadNameType', 'original');

            try {
                const uploadUrl = `${IMG_BED_DOMAIN}/upload?uploadChannel=huggingface&uploadFolder=${encodeURIComponent(uploadFolder)}`;
                const res = await fetch(uploadUrl, { method: 'POST', body: formData });
                const data = await res.json();

                let imageUrl = '';
                if (typeof data === 'string') imageUrl = data;
                else if (data.url) imageUrl = data.url;
                else if (data.src) imageUrl = data.src;
                else if (Array.isArray(data) && data[0]) imageUrl = data[0].src || data[0].url || data[0];
                else if (data.data && data.data.url) imageUrl = data.data.url;

                if (imageUrl && !imageUrl.startsWith('http://') && !imageUrl.startsWith('https://')) {
                    const baseUrl = IMG_BED_DOMAIN.replace(/\/+$/, '');
                    const path = imageUrl.replace(/^\/+/, '');
                    imageUrl = `${baseUrl}/${path}`;
                }
                return imageUrl;
            } catch (e) {
                alert("图片上传失败，请稍后重试");
                return null;
            }
        }

        function triggerNoteImageSelect() { document.getElementById('note-image-file-input').click(); }

        async function uploadNoteImage(input) {
            const file = input.files[0];
            if (!file) return;

            const btn = document.getElementById('img-upload-btn');
            btn.innerText = "⏳ 上传中...";
            btn.disabled = true;

            const imageUrl = await uploadFileToBed(file, '/备忘录/图片内容');
            if (imageUrl) {
                insertImageToEditor(imageUrl);
            }

            btn.innerText = "📷 图片";
            btn.disabled = false;
            input.value = '';
        }

        function insertImageToEditor(url) {
            const editor = document.getElementById('note-content-editor');
            editor.focus();
            const imgHtml = `<img src="${url}" style="max-width:100%; border-radius:8px; margin:8px 0; display:block;" /><br>`;
            document.execCommand('insertHTML', false, imgHtml);
            onEditorInput();
        }

        /* 文件夹管理 */
        async function fetchFolders() {
            if (isLoggedIn()) {
                const res = await apiFetch('/api/folders');
                if (res && res.ok) foldersData = await res.json();
                else foldersData = [];
            } else {
                foldersData = JSON.parse(localStorage.getItem('guest_folders') || '[]');
            }
            renderSidebar();
        }

        async function createNewFolder() {
            const name = prompt("输入新文件夹名称：");
            if (name && name.trim()) {
                if (isLoggedIn()) {
                    await apiFetch('/api/folders', { method: 'POST', body: JSON.stringify({ name: name.trim() }) });
                } else {
                    foldersData.push({ id: Date.now(), name: name.trim() });
                    localStorage.setItem('guest_folders', JSON.stringify(foldersData));
                }
                fetchFolders();
            }
        }

        async function deleteFolder(id, event) {
            event.stopPropagation();
            if (confirm("确定删除该文件夹？（里面的笔记不会丢失，会移至未分类）")) {
                if (isLoggedIn()) {
                    await apiFetch('/api/folders', { method: 'DELETE', body: JSON.stringify({ id }) });
                } else {
                    foldersData = foldersData.filter(f => f.id !== id);
                    localStorage.setItem('guest_folders', JSON.stringify(foldersData));
                }
                if (currentFilter === id) selectFilter('all', '所有笔记');
                else fetchFolders();
            }
        }

        /* 笔记 CRUD 与渲染 */
        async function fetchNotes() {
            if (isLoggedIn()) {
                const res = await apiFetch('/api/notes');
                if (res && res.ok) notesData = await res.json();
                else notesData = [];
            } else {
                notesData = JSON.parse(localStorage.getItem('guest_notes') || '[]');
            }
            renderNotes();
            updateCreationStats();
        }

        /* 最近删除 (7天保留期) 逻辑 */
        async function fetchTrashNotes() {
            if (isLoggedIn()) {
                const res = await apiFetch('/api/notes/trash');
                if (res && res.ok) trashNotesData = await res.json();
                else trashNotesData = [];
            } else {
                trashNotesData = JSON.parse(localStorage.getItem('guest_trash_notes') || '[]');
            }
            // 自动清理超过 7 天的数据
            const now = Date.now();
            const sevenDaysMs = 7 * 24 * 60 * 60 * 1000;
            const validTrash = trashNotesData.filter(n => (now - (n.deleted_at || now)) < sevenDaysMs);
            
            if (validTrash.length !== trashNotesData.length) {
                trashNotesData = validTrash;
                if (!isLoggedIn()) localStorage.setItem('guest_trash_notes', JSON.stringify(trashNotesData));
            }
            renderTrashList();
        }

        function renderTrashList() {
            const list = document.getElementById('trash-list');
            if (trashNotesData.length === 0) {
                list.innerHTML = `<div style="text-align:center; color:#8e8e93; margin-top:60px;">回收站为空</div>`;
                return;
            }

            const now = Date.now();
            const sevenDaysMs = 7 * 24 * 60 * 60 * 1000;

            list.innerHTML = trashNotesData.map(n => {
                const deletedTime = n.deleted_at || now;
                const remainMs = sevenDaysMs - (now - deletedTime);
                const remainDays = Math.max(1, Math.ceil(remainMs / (1000 * 60 * 60 * 24)));
                const displayTitle = n.title ? n.title : '无标题备忘录';

                return `
                    <div class="note-container">
                        <div class="note-item" style="display:flex; justify-content:space-between; align-items:center;">
                            <div>
                                <div class="note-title">${escapeHtml(displayTitle)}</div>
                                <div class="note-item-date">剩余 ${remainDays} 天后自动清除</div>
                            </div>
                            <div style="display:flex; gap:8px;">
                                <button class="btn" style="font-size:14px;" onclick="restoreTrashNote(${n.id})">恢复</button>
                                <button class="btn" style="font-size:14px; color:var(--delete-red);" onclick="purgeTrashNote(${n.id})">删除</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('trash-count-display').innerText = trashNotesData.length;
        }

        async function restoreTrashNote(id) {
            const noteIndex = trashNotesData.findIndex(n => n.id === id);
            if (noteIndex === -1) return;

            const [restoredNote] = trashNotesData.splice(noteIndex, 1);
            delete restoredNote.deleted_at;
            notesData.push(restoredNote);

            if (!isLoggedIn()) {
                localStorage.setItem('guest_notes', JSON.stringify(notesData));
                localStorage.setItem('guest_trash_notes', JSON.stringify(trashNotesData));
            }
            renderTrashList();
            fetchNotes();
        }

        async function purgeTrashNote(id) {
            if (!confirm("确定要彻底删除该笔记吗？")) return;
            trashNotesData = trashNotesData.filter(n => n.id !== id);
            if (!isLoggedIn()) localStorage.setItem('guest_trash_notes', JSON.stringify(trashNotesData));
            renderTrashList();
            updateCreationStats();
        }

        async function clearAllTrash() {
            if (trashNotesData.length === 0) return;
            if (confirm("确定清空最近删除？所有笔记将彻底消失！")) {
                trashNotesData = [];
                if (!isLoggedIn()) localStorage.setItem('guest_trash_notes', JSON.stringify(trashNotesData));
                renderTrashList();
                updateCreationStats();
            }
        }

        /* Auth 相关 */
        function handleAuthButtonClick() {
            if (isLoggedIn()) {
                if (confirm("确定要退出登录吗？")) {
                    localStorage.removeItem('auth_token');
                    localStorage.removeItem('auth_username');
                    initData();
                }
            } else {
                openAuthModal();
            }
        }

        function openAuthModal() {
            isAuthRegisterMode = false;
            document.getElementById('auth-title').innerText = "账号登录";
            document.getElementById('auth-submit-btn').innerText = "登录";
            document.getElementById('auth-switch-btn').innerText = "没有账号？立即注册";
            document.getElementById('auth-username').value = "";
            document.getElementById('auth-password').value = "";
            document.getElementById('auth-modal-overlay').classList.add('active');
            document.getElementById('auth-card').classList.add('active');
        }

        function closeAuthModal() {
            document.getElementById('auth-modal-overlay').classList.remove('active');
            document.getElementById('auth-card').classList.remove('active');
        }

        function toggleAuthMode() {
            isAuthRegisterMode = !isAuthRegisterMode;
            document.getElementById('auth-title').innerText = isAuthRegisterMode ? "账号注册" : "账号登录";
            document.getElementById('auth-submit-btn').innerText = isAuthRegisterMode ? "注册并开启云同步" : "登录";
            document.getElementById('auth-switch-btn').innerText = isAuthRegisterMode ? "已有账号？直接登录" : "没有账号？立即注册";
        }

        async function submitAuth() {
            const username = document.getElementById('auth-username').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            if (!username || !password) return alert("请填写用户名和密码");

            const guestNotes = JSON.parse(localStorage.getItem('guest_notes') || '[]');
            const endpoint = isAuthRegisterMode ? '/api/register' : '/api/login';

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, guestNotes })
                });

                const data = await res.json();
                if (res.ok && data.token) {
                    localStorage.setItem('auth_token', data.token);
                    localStorage.setItem('auth_username', data.username);
                    localStorage.removeItem('guest_notes');

                    alert(guestNotes.length > 0 ? "登录成功！本地游客笔记已成功合并至你的云端账号！" : "登录成功！");
                    closeAuthModal();
                    initData();
                } else {
                    alert(data.error || "操作失败");
                }
            } catch (e) {
                alert("请求失败，请稍后重试");
            }
        }

        function toggleSidebar(open) {
            document.getElementById('sidebar-overlay').classList.toggle('active', open);
            document.getElementById('sidebar').classList.toggle('active', open);
        }

        function renderSidebar() {
            const menu = document.getElementById('sidebar-menu-list');
            let html = `
                <div class="sidebar-item ${currentFilter === 'all' ? 'active' : ''}" onclick="selectFilter('all', '所有笔记')">
                    <span>📝 所有笔记</span>
                </div>
                <div class="sidebar-item ${currentFilter === 'locked' ? 'active' : ''}" onclick="selectFilter('locked', '加密笔记')">
                    <span>🔒 加密笔记</span>
                </div>
            `;

            if (foldersData.length > 0) {
                html += `<div style="font-size:12px; color:#8e8e93; margin: 12px 0 6px 10px;">我的文件夹</div>`;
                html += foldersData.map(f => `
                    <div class="sidebar-item ${currentFilter === f.id ? 'active' : ''}" onclick="selectFilter(${f.id}, '${escapeHtml(f.name)}')">
                        <span>📁 ${escapeHtml(f.name)}</span>
                        <span onclick="deleteFolder(${f.id}, event)" style="font-size:12px; opacity:0.5;">✕</span>
                    </div>
                `).join('');
            }
            menu.innerHTML = html;

            const select = document.getElementById('editor-folder-select');
            select.innerHTML = `<option value="0">未分类</option>` + 
                foldersData.map(f => `<option value="${f.id}">${escapeHtml(f.name)}</option>`).join('');
        }

        function selectFilter(filter, title) {
            currentFilter = filter;
            document.getElementById('page-title').innerText = title;
            renderSidebar();
            renderNotes();
            toggleSidebar(false);
        }

        /* 过滤逻辑支持“加锁笔记显示控制” */
        function getFilteredNotes() {
            let list = notesData;

            if (lockDisplayMode === 'locked_only' && currentFilter !== 'locked') {
                list = list.filter(n => !n.password);
            }

            if (currentFilter === 'all') return list;
            if (currentFilter === 'locked') return notesData.filter(n => !!n.password);
            return list.filter(n => n.folder_id === currentFilter);
        }

        function renderNotes() {
            const list = document.getElementById('notes-list');
            const filtered = getFilteredNotes();

            if (filtered.length === 0) {
                list.innerHTML = `<div style="text-align:center; color:#8e8e93; margin-top:60px;">该分组无备忘录</div>`;
                return;
            }

            const pinnedNotes = filtered.filter(n => n.is_pinned);
            const otherNotes = filtered.filter(n => !n.is_pinned);

            let html = '';
            if (pinnedNotes.length > 0) {
                html += `<div class="section-title">置顶</div>`;
                html += pinnedNotes.map(n => renderNoteItem(n)).join('');
            }
            if (otherNotes.length > 0) {
                if (pinnedNotes.length > 0) html += `<div class="section-title">备忘录</div>`;
                html += otherNotes.map(n => renderNoteItem(n)).join('');
            }
            list.innerHTML = html;
        }

        function renderNoteItem(n) {
            const isLocked = !!n.password;
            const displayTitle = n.title ? n.title : (isLocked ? '已加密备忘录' : '无标题备忘录');
            
            return `
                <div class="note-container" id="container-${n.id}">
                    <div class="swipe-actions">
                        <button class="action-btn pin" onclick="quickPin(${n.id}, event)">${n.is_pinned ? '取消' : '置顶'}</button>
                        <button class="action-btn lock" onclick="quickLock(${n.id}, event)">${isLocked ? '解密' : '加密'}</button>
                        <button class="action-btn delete" onclick="deleteNote(${n.id}, event)">删除</button>
                    </div>
                    <div class="note-item" id="item-${n.id}" onclick="clickNote(${n.id})" 
                         ontouchstart="handleTouchStart(event, ${n.id})" 
                         ontouchmove="handleTouchMove(event, ${n.id})" 
                         ontouchend="handleTouchEnd(event, ${n.id})">
                        <div class="note-header-line">
                            <div class="note-title">${escapeHtml(displayTitle)}</div>
                            <div class="note-badge">
                                ${n.is_pinned ? '📌' : ''}
                                ${isLocked ? '🔒' : ''}
                            </div>
                        </div>
                        <div class="note-item-date">${new Date(n.created_at || Date.now()).toLocaleDateString()}</div>
                    </div>
                </div>
            `;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text;
            return div.innerHTML;
        }

        function clickNote(id) {
            if (currentOpenId !== null) return resetItem(currentOpenId);
            const note = notesData.find(n => n.id === id);
            if (!note) return;

            if (note.password) {
                const input = prompt("该备忘录已加密，请输入密码：");
                if (input !== note.password) return alert("密码错误！");
            }
            openEditor(id);
        }

        async function saveNote() {
            const title = document.getElementById('note-title-input').value.trim();
            const content = document.getElementById('note-content-editor').innerHTML;
            const folder_id = parseInt(document.getElementById('editor-folder-select').value) || 0;

            if (!title && (!content || content === '<br>')) return closeSubView('editor-view');

            const existingNote = notesData.find(n => n.id === currentNoteId);

            if (isLoggedIn()) {
                const method = currentNoteId ? 'PUT' : 'POST';
                const body = JSON.stringify({ 
                    id: currentNoteId, title, content, 
                    is_pinned: existingNote ? existingNote.is_pinned : 0, 
                    password: existingNote ? existingNote.password : '', folder_id 
                });
                await apiFetch('/api/notes', { method, body });
            } else {
                if (currentNoteId) {
                    const idx = notesData.findIndex(n => n.id === currentNoteId);
                    if (idx !== -1) {
                        notesData[idx] = { ...notesData[idx], title, content, folder_id };
                    }
                } else {
                    notesData.push({
                        id: Date.now(), title, content, is_pinned: 0, password: '', folder_id, created_at: new Date().toISOString()
                    });
                }
                localStorage.setItem('guest_notes', JSON.stringify(notesData));
            }

            closeSubView('editor-view');
            fetchNotes();
        }

        async function quickPin(id, event) {
            if (event && event.stopPropagation) event.stopPropagation();
            resetItem(id);
            const note = notesData.find(n => n.id === id);
            if (!note) return;

            note.is_pinned = note.is_pinned ? 0 : 1;
            if (isLoggedIn()) {
                await apiFetch('/api/notes', { method: 'PUT', body: JSON.stringify(note) });
            } else {
                localStorage.setItem('guest_notes', JSON.stringify(notesData));
            }
            fetchNotes();
        }

        async function quickLock(id, event) {
            if (event && event.stopPropagation) event.stopPropagation();
            resetItem(id);
            const note = notesData.find(n => n.id === id);
            if (!note) return;

            if (note.password) {
                if (confirm("是否移除密码？")) note.password = '';
            } else {
                const pwd = prompt("设置加密密码：");
                if (pwd !== null && pwd.trim() !== '') note.password = pwd.trim();
            }

            if (isLoggedIn()) {
                await apiFetch('/api/notes', { method: 'PUT', body: JSON.stringify(note) });
            } else {
                localStorage.setItem('guest_notes', JSON.stringify(notesData));
            }
            fetchNotes();
        }

        async function deleteNote(id, event) {
            if (event && event.stopPropagation) event.stopPropagation();
            closeContextMenu();

            const container = document.getElementById(`container-${id}`);
            if (container) {
                container.style.opacity = '0';
                container.style.transform = 'scale(0.9)';
                container.style.transition = 'opacity 0.2s, transform 0.2s';
            }

            setTimeout(async () => {
                const targetIndex = notesData.findIndex(n => n.id === id);
                if (targetIndex !== -1) {
                    const [deletedNote] = notesData.splice(targetIndex, 1);
                    deletedNote.deleted_at = Date.now();
                    trashNotesData.push(deletedNote);

                    if (isLoggedIn()) {
                        await apiFetch('/api/notes', { method: 'DELETE', body: JSON.stringify({ id }) });
                    } else {
                        localStorage.setItem('guest_notes', JSON.stringify(notesData));
                        localStorage.setItem('guest_trash_notes', JSON.stringify(trashNotesData));
                    }
                }
                fetchNotes();
                renderTrashList();
            }, 200);
        }

        /* 滑动与长按逻辑 */
        let startX = 0, startY = 0, currentX = 0, currentOpenId = null;
        let longPressTimer = null, isLongPressed = false;

        function handleTouchStart(e, id) {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            currentX = startX;
            isLongPressed = false;
            const item = document.getElementById(`item-${id}`);

            if (currentOpenId !== null && currentOpenId !== id) resetItem(currentOpenId);
            item.classList.add('pressing');

            longPressTimer = setTimeout(() => {
                isLongPressed = true;
                item.classList.remove('pressing');
                if (navigator.vibrate) navigator.vibrate([20, 30]);
                item.classList.add('pop-active');
                openContextMenu(id);
            }, 450);
        }

        function handleTouchMove(e, id) {
            currentX = e.touches[0].clientX;
            const diffX = currentX - startX;
            const diffY = e.touches[0].clientY - startY;

            if (Math.abs(diffX) > 8 || Math.abs(diffY) > 8) {
                clearTimeout(longPressTimer);
                document.getElementById(`item-${id}`).classList.remove('pressing');
            }

            if (isLongPressed) return;
            const item = document.getElementById(`item-${id}`);

            if (diffX < 0) {
                if (currentOpenId !== id) {
                    item.style.transform = `translateX(${Math.max(diffX, -210)}px)`;
                    item.style.transition = 'none';
                }
            } else if (diffX > 0 && currentOpenId === id) {
                item.style.transform = `translateX(${Math.min(-210 + diffX, 0)}px)`;
                item.style.transition = 'none';
            }
        }

        function handleTouchEnd(e,id) {
            clearTimeout(longPressTimer);
            const item = document.getElementById(`item-${id}`);
            item.classList.remove('pressing');

            if (isLongPressed) return;
            const diffX = currentX - startX;
            item.style.transition = 'transform 0.25s cubic-bezier(0.25, 1, 0.5, 1)';

            if (currentOpenId !== id && diffX < -60) {
                item.style.transform = `translateX(-210px)`;
                currentOpenId = id;
            } else if (currentOpenId === id && diffX > 60) {
                resetItem(id);
            } else {
                if (currentOpenId === id) item.style.transform = `translateX(-210px)`;
                else resetItem(id);
            }
        }

        function resetItem(id) {
            const item = document.getElementById(`item-${id}`);
            if (item) item.style.transform = `translateX(0px)`;
            if (currentOpenId === id) currentOpenId = null;
        }

        function openContextMenu(id) {
            activeMenuNoteId = id;
            const note = notesData.find(n => n.id === id);
            if (!note) return;

            document.getElementById('menu-pin-text').innerText = note.is_pinned ? '取消置顶' : '置顶备忘录';
            document.getElementById('menu-lock-text').innerText = note.password ? '移除加密' : '加密备忘录';

            document.getElementById('context-overlay').classList.add('active');
            document.getElementById('context-menu').classList.add('active');
        }

        function closeContextMenu() {
            document.getElementById('context-overlay').classList.remove('active');
            document.getElementById('context-menu').classList.remove('active');
            if (activeMenuNoteId !== null) {
                const item = document.getElementById(`item-${activeMenuNoteId}`);
                if (item) item.classList.remove('pop-active');
                activeMenuNoteId = null;
            }
        }

        function handleMenuAction(action) {
            const id = activeMenuNoteId;
            closeContextMenu();
            if (action === 'pin') quickPin(id, { stopPropagation: () => {} });
            if (action === 'lock') quickLock(id, { stopPropagation: () => {} });
            if (action === 'delete') deleteNote(id, { stopPropagation: () => {} });
        }

        /* 视图弹窗控制 */
        function openSubView(viewId) { document.getElementById(viewId).classList.add('active'); }
        function closeSubView(viewId) { document.getElementById(viewId).classList.remove('active'); }

        /* 加锁笔记设置 Modal */
        function openLockModal() {
            document.getElementById('lock-modal-overlay').classList.add('active');
            document.getElementById('lock-modal-card').classList.add('active');
            renderLockModalRadio();
        }

        function closeLockModal() {
            document.getElementById('lock-modal-overlay').classList.remove('active');
            document.getElementById('lock-modal-card').classList.remove('active');
        }

        function setLockDisplayMode(mode) {
            lockDisplayMode = mode;
            saveSettings();
            renderLockModalRadio();
            renderNotes();
            setTimeout(closeLockModal, 150);
        }

        function renderLockModalRadio() {
            const radioAll = document.getElementById('radio-lock-all');
            const radioOnly = document.getElementById('radio-lock-only');
            if (lockDisplayMode === 'all') {
                radioAll.classList.add('checked');
                radioOnly.classList.remove('checked');
            } else {
                radioAll.classList.remove('checked');
                radioOnly.classList.add('checked');
            }
        }

        function openEditor(id = null) {
            currentNoteId = id;
            const note = notesData.find(n => n.id === id);

            if (note) {
                document.getElementById('note-title-input').value = note.title || '';
                document.getElementById('note-content-editor').innerHTML = note.content || '';
                document.getElementById('editor-folder-select').value = note.folder_id || 0;
            } else {
                document.getElementById('note-title-input').value = '';
                document.getElementById('note-content-editor').innerHTML = '';
                document.getElementById('editor-folder-select').value = (typeof currentFilter === 'number') ? currentFilter : 0;
            }

            openSubView('editor-view');
            onEditorInput();
        }

        /* 编辑器字数实时更新（支持开关） */
        function onEditorInput() {
            const showWordCount = document.getElementById('setting-word-count').checked;
            const tag = document.getElementById('editor-word-count-tag');
            if (showWordCount) {
                const title = document.getElementById('note-title-input').value || '';
                const contentHtml = document.getElementById('note-content-editor').innerHTML || '';
                const total = title.length + getPlainTextLength(contentHtml);
                tag.innerText = `${total} 字`;
                tag.style.display = 'inline';
            } else {
                tag.style.display = 'none';
            }
        }

        /* 设置保存与加载 */
        function saveSettings() {
            const settings = {
                skin: document.getElementById('setting-skin').checked,
                wordCount: document.getElementById('setting-word-count').checked,
                fontSize: document.getElementById('setting-font-size-text').innerText,
                lockDisplayMode: lockDisplayMode
            };
            localStorage.setItem('app_settings', JSON.stringify(settings));
        }

        function loadSavedSettings() {
            const saved = localStorage.getItem('app_settings');
            if (saved) {
                const settings = JSON.parse(saved);
                document.getElementById('setting-skin').checked = settings.skin || false;
                document.getElementById('setting-word-count').checked = settings.wordCount !== false;
                document.getElementById('setting-font-size-text').innerText = settings.fontSize || '16';
                lockDisplayMode = settings.lockDisplayMode || 'all';
            }
        }

        function changeDefaultFontSize() {
            const size = prompt("请输入笔记默认字号 (如 14, 16, 18)：", document.getElementById('setting-font-size-text').innerText);
            if (size && !isNaN(size)) {
                document.getElementById('setting-font-size-text').innerText = size.trim();
                saveSettings();
            }
        }

        initData();
    </script>
</body>
</html>
